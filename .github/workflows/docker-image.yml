name: Docker Image Build and Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME_DOCKERHUB: jianjungki/funasr
  IMAGE_NAME_GHCR: ghcr.io/jianjungki/funasr
  BUILD_CONTEXT: examples/openai_api
  DOCKERFILE: examples/openai_api/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME_DOCKERHUB }}:${{ github.sha }}
            ${{ env.IMAGE_NAME_DOCKERHUB }}:latest
            ${{ env.IMAGE_NAME_GHCR }}:${{ github.sha }}
            ${{ env.IMAGE_NAME_GHCR }}:latest
